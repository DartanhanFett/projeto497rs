name: CI — Build check

# Roda em todo PR e em push pra main, validando que o site compila.
# Pega problemas como erros de schema (Zod), TS, falhas de build, etc
# ANTES do Netlify tentar deployar e potencialmente quebrar produção.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Permite rodar manualmente
  workflow_dispatch: {}

permissions:
  contents: read

# Cancela builds antigas se tiver outras pendentes no mesmo branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check + Astro check
        run: npx astro check
        # Não falha o build em type warnings (apenas em erros reais)
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          # Skip telemetria do Astro
          ASTRO_TELEMETRY_DISABLED: '1'

      # Sanity check — se chegou aqui mas dist/ está vazio, algo deu errado
      - name: Verify dist/ output
        run: |
          if [ ! -d dist ]; then
            echo "::error::dist/ não foi criado"
            exit 1
          fi
          page_count=$(find dist -name "*.html" | wc -l)
          if [ "$page_count" -lt 100 ]; then
            echo "::error::Apenas $page_count páginas HTML — esperado 500+"
            exit 1
          fi
          echo "✓ $page_count páginas HTML geradas"
