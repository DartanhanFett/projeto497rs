# ────────────────────────────────────────────────────────────
# Netlify — Projeto 497 RS
#
# Configuração de build + headers de segurança (defesa em profundidade).
# ────────────────────────────────────────────────────────────

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ────────────────────────────────────────────────────────────
# Headers globais de segurança
#
# Aplicados em todas as rotas. CSP em modo Report-Only por padrão —
# violações são logadas no console do browser sem quebrar nada. Após
# 1-2 semanas de monitoramento sem violações legítimas, trocar pra
# `Content-Security-Policy` (sem -Report-Only) pra ativar de verdade.
# ────────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # Anti-clickjacking
    X-Frame-Options = "SAMEORIGIN"
    # Browser não infere MIME a partir do conteúdo
    X-Content-Type-Options = "nosniff"
    # Referrer mínimo entre origens
    Referrer-Policy = "strict-origin-when-cross-origin"
    # HSTS — força HTTPS por 1 ano (Netlify provisiona Let's Encrypt automaticamente)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Nega APIs sensíveis do browser (não usamos nenhuma)
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()"
    # Cross-Origin Opener — isola janela, mitiga Spectre-like attacks
    Cross-Origin-Opener-Policy = "same-origin"
    # Content Security Policy — modo Report-Only enquanto monitoramos.
    # Permite:
    #   - identity.netlify.com  → Netlify Identity widget
    #   - unpkg.com             → Decap CMS
    #   - fonts.googleapis.com  → tipografia
    #   - cdn.projeto497rs.com.br → mídias do R2
    #   - www.instagram.com / *.cdninstagram.com → embeds de Reel
    #   - api.netlify.com       → Identity / Git Gateway
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://identity.netlify.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; img-src 'self' data: blob: https://cdn.projeto497rs.com.br https://www.instagram.com https://*.cdninstagram.com https://*.fbcdn.net; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://identity.netlify.com https://api.netlify.com https://*.r2.cloudflarestorage.com https://cdn.projeto497rs.com.br https://demotiles.maplibre.org; frame-src https://www.instagram.com; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https://identity.netlify.com; frame-ancestors 'self'; upgrade-insecure-requests"

# ────────────────────────────────────────────────────────────
# Cache
# ────────────────────────────────────────────────────────────

# GeoJSON (não muda com frequência — pode cachear forte)
[[headers]]
  for = "/geo/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

# Assets buildados pelo Astro (têm hash no nome)
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# /api/stats.json — consumido pelo site mãe (conhecendoobrasil.com.br)
# Cache curto pra refletir atualizações rápido.
#
# CORS: mantém aberto até o site mãe existir. Quando ele estiver no ar,
# trocar `*` pelo domínio específico.
[[headers]]
  for = "/api/stats.json"
  [headers.values]
    Cache-Control = "public, max-age=300, s-maxage=300"
    Access-Control-Allow-Origin = "*"

# OG images (geradas no build)
[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
