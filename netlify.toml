# ────────────────────────────────────────────────────────────
# Netlify — Projeto 497 RS
# ────────────────────────────────────────────────────────────

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Headers globais
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache agressivo pro GeoJSON (não muda)
[[headers]]
  for = "/geo/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

# Cache pros assets estáticos buildados pelo Astro
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# /api/stats.json — consumido pelo site mãe (conhecendoobrasil.com.br)
# Cache curto pra refletir atualizações rápido após cada build.
[[headers]]
  for = "/api/stats.json"
  [headers.values]
    Cache-Control = "public, max-age=300, s-maxage=300"
    Access-Control-Allow-Origin = "*"
